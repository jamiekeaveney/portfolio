<link rel="preload" as="font" type="font/ttf" crossorigin href="https://webflow-files-prod.global.ssl.fastly.net/677ec1f8458ab71b3bab4e74/fonts/6af51c931c8fb338c6310358-Delight-VF.ttf">
<meta name="theme-color" content="#000000">
<style>
.page_shell {
  --loader-surface: #000;
  --loader-ink: #fff;
}
.page_shell[data-theme-status="light"] {
  --loader-surface: #f7f7f5;
  --loader-ink: #111;
}

.page_shell[data-loader-pending]::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  background: var(--loader-surface);
  pointer-events: none;
}
</style>
<script>
(() => {
  const root = document.documentElement;
  if (root.matches(".wf-design-mode, .wf-editor")) return;

  let light = false;
  try {
    light = localStorage.getItem("jk-theme") === "light";
  } catch {}
  root.classList.add("page_shell");
  root.classList.toggle("u-theme-light", light);
  root.dataset.themeStatus = light ? "light" : "dark";
  if (light) document.querySelector('meta[name="theme-color"]').content = "#f7f7f5";
  if (performance.getEntriesByType("navigation")[0]?.type !== "back_forward") {
    root.classList.add("page_shell_intro");
  }
  root.setAttribute("data-loader-pending", "");
  root.setAttribute("data-loader-active", "");
  history.scrollRestoration = "manual";

  const viewport = document.querySelector('meta[name="viewport"]');
  if (viewport && !viewport.content.includes("viewport-fit=")) {
    viewport.content += ", viewport-fit=cover";
  }
  function releaseCover() {
    root.removeAttribute("data-loader-pending");
    root.removeAttribute("data-loader-active");
    root.classList.remove("page_shell_intro");
  }
  document.addEventListener("DOMContentLoaded", () => {
    if (!document.querySelector(".loader_wrap")) releaseCover();
  }, { once: true });
  setTimeout(() => {
    if (root.hasAttribute("data-loader-pending")) releaseCover();
  }, 12000);
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jamiekeaveney/portfolio@v1.5.0/dist/css/site.css">
