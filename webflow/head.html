<script>
(function(){
 var root=document.documentElement;
 if(root.classList.contains('wf-design-mode')||root.classList.contains('wf-editor'))return;
 var preferred='dark';
 try { if(localStorage.getItem('jk-theme')==='light')preferred='light'; } catch {}
 root.dataset.themeStatus=preferred;
 var chromeColor=document.querySelector('meta[name="theme-color"]');
 var palette;
 if(chromeColor)chromeColor.classList.add('u-theme-light');
 function applyNativeTheme() {
   if(!document.body)return;
   var light=root.dataset.themeStatus==='light';
   document.body.classList.toggle('u-theme-light',light);
   if(light && chromeColor && !palette){
     var colors=getComputedStyle(chromeColor);
     palette=Array.from(colors).filter(function(name){return name.indexOf('--_theme---color--')===0;}).map(function(name){return [name,colors.getPropertyValue(name).trim()];});
   }
   if(palette)palette.forEach(function(item){
     if(light)root.style.setProperty(item[0],item[1]);
     else root.style.removeProperty(item[0]);
   });
   var background=getComputedStyle(root).getPropertyValue('--_theme---color--background').trim();
   if(chromeColor && background)chromeColor.content=background;
 }
 var themeWatcher=new MutationObserver(function(){
   if(!document.body)return;
   themeWatcher.observe(root,{attributes:true,attributeFilter:['data-theme-status']});
   applyNativeTheme();
 });
 themeWatcher.observe(root,{childList:!document.body,attributes:true,attributeFilter:['data-theme-status']});
 applyNativeTheme();
 var viewport=document.querySelector('meta[name="viewport"]');
 if(viewport&&!viewport.content.includes('viewport-fit='))viewport.content+=', viewport-fit=cover';
 history.scrollRestoration='manual';root.setAttribute('data-loader-pending','');root.setAttribute('data-loader-active','');

 setTimeout(function(){if(root.hasAttribute('data-loader-pending')){root.removeAttribute('data-loader-pending');root.removeAttribute('data-loader-active');}},12000);
})();
</script>
